<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adam Sandler | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.85)),
                url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba");

            background-size: cover;
            background-position: center;
        }

        .container {
            width: 380px;
            padding: 45px 40px;

            background: rgba(20, 20, 20, 0.92);

            border-radius: 20px;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);

            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #ddd;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;

            border: 1px solid #444;
            border-radius: 10px;

            background: #292929;
            color: white;

            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #e50914;
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #e50914;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #b20710;
            transform: translateY(-2px);
        }

        .erro {
            margin-top: 20px;
            padding: 10px;

            border-radius: 8px;

            background: rgba(229, 9, 20, 0.15);
            color: #ff6b6b;

            font-size: 14px;
        }

        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 12px;
        }

        .footer span {
            color: #e50914;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🎬</div>

        <h1>Adam Sandler</h1>

        <p class="subtitle">
            Recomendações, avaliações e filmes
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="usuario">Usuário</label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Digite seu usuário"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

        {% if erro %}
            <div class="erro">
                {{ erro }}
            </div>
        {% endif %}

        <div class="footer">
            Um espaço para quem ama os filmes do
            <span>Adam Sandler</span>.
        </div>

    </div>

</body>

</html>
